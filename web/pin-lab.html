<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin lab — marker shapes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<style>
  /* A scratch page for choosing a marker shape. Not part of the map itself --
     it loads the same data and the same tokens so what you see here is what
     you get there. Nothing in map.js depends on this file. */
  .lab { display: grid; grid-template-rows: auto 1fr; height: 100%; }

  .lab-head {
    padding: 14px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface-1);
  }

  .lab-head h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }

  .lab-head p {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .lab-body { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }

  .swatches {
    overflow-y: auto;
    padding: 14px;
    border-right: 1px solid var(--hairline);
    background: var(--surface-1);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    align-content: start;
  }

  .swatch {
    display: grid;
    justify-items: center;
    gap: 6px;
    padding: 12px 6px 9px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--page);
    cursor: pointer;
    font: inherit;
    color: var(--text-secondary);
    font-size: 11.5px;
  }

  .swatch:hover { border-color: var(--accent); }

  .swatch[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--wash);
    color: var(--accent-ink);
    font-weight: 600;
  }

  .swatch .art { height: 34px; display: grid; place-items: end center; }
  .swatch svg { display: block; overflow: visible; }

  .note {
    grid-column: 1 / -1;
    margin: 4px 0 8px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-muted);
    min-height: 3em;
  }

  .lab-map { position: relative; min-width: 0; }
  #map { height: 100%; width: 100%; background: var(--page); }

  .lab-bar {
    position: absolute;
    z-index: 600;
    top: 12px; right: 12px;
    display: flex;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-1);
    box-shadow: var(--shadow);
  }

  .lab-bar button {
    border: 0;
    border-radius: 5px;
    padding: 5px 9px;
    background: none;
    font: inherit;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
  }

  .lab-bar button:hover { background: var(--wash); }

  .code {
    position: absolute;
    z-index: 600;
    left: 12px; bottom: 24px;
    max-width: min(560px, calc(100% - 24px));
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-1);
    box-shadow: var(--shadow);
    font-size: 11px;
    line-height: 1.45;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 128px;
    overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>

<div class="lab">
  <header class="lab-head">
    <h1>Pin lab</h1>
    <p>The same 47 pins and the same tokens as the map — judge them by the crowd, not by one pin.</p>
  </header>

  <div class="lab-body">
    <div class="swatches" id="swatches">
      <p class="note" id="note"></p>
    </div>
    <div class="lab-map">
      <div class="lab-bar">
        <button type="button" id="theme">Dark</button>
        <button type="button" id="zoom-in">Zoom in</button>
        <button type="button" id="zoom-out">Zoom out</button>
      </div>
      <div id="map"></div>
      <div class="code" id="code"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* Each variant gives its own viewBox, size and anchor. Shapes with a point
   (teardrop, needle, flag, chevron) anchor at the bottom so the tip marks the
   address; symmetric shapes anchor at their centre. */
const VARIANTS = [
  {
    id: "teardrop", name: "Teardrop", size: [21, 30], anchor: "bottom",
    note: "What the map uses now. Unmistakably a location and anchors exactly, but it is the most ink of any option — which is the thing to judge at this density.",
    box: "0 0 24 34",
    svg: '<path class="pin-body" d="M12 1.4c-5.8 0-10.5 4.6-10.5 10.3 0 7.7 10.5 20.9 10.5 20.9s10.5-13.2 10.5-20.9C22.5 6 17.8 1.4 12 1.4z"/><circle class="pin-eye" cx="12" cy="11.5" r="3.9"/>'
  },
  {
    id: "needle", name: "Needle", size: [14, 30], anchor: "bottom",
    note: "A head on a hairline stem. Very editorial-cartography: the stem points at the door while the head carries almost no weight. Reads beautifully on white space.",
    box: "0 0 16 34",
    svg: '<line class="pin-stem" x1="8" y1="33" x2="8" y2="14"/><circle class="pin-body" cx="8" cy="9" r="6"/>'
  },
  {
    id: "ring", name: "Ring", size: [15, 15], anchor: "center",
    note: "Hollow centre. The least ink of the lot and overlapping pins stay countable, but it does not point at anything — the address is the centre.",
    box: "0 0 16 16",
    svg: '<circle class="pin-hollow" cx="8" cy="8" r="5.4"/>'
  },
  {
    id: "seal", name: "Seal", size: [17, 17], anchor: "center",
    note: "A Chinese name-chop. A vermilion square seal is exactly the register this guide sits in, and it is the one shape here that means something rather than just marking a spot.",
    box: "0 0 18 18",
    svg: '<rect class="pin-body" x="1.6" y="1.6" width="14.8" height="14.8" rx="2.6"/><path class="pin-eye-stroke" d="M9 4.8v8.4M4.8 9h8.4"/>'
  },
  {
    id: "bowl", name: "Bowl", size: [20, 17], anchor: "center",
    note: "A rice bowl silhouette. The most thematic and the most fun, but a pictogram at 17px is doing well to read as anything — check it zoomed out before committing.",
    box: "0 0 22 18",
    svg: '<path class="pin-body" d="M2.2 7.4h17.6c0 5.2-3.9 8.6-8.8 8.6S2.2 12.6 2.2 7.4z"/><path class="pin-stroke" d="M6.6 4.4 9 1.9M11 4.4 13.4 1.9"/>'
  },
  {
    id: "dot", name: "Dot", size: [13, 13], anchor: "center",
    note: "The original. Quiet, dense-friendly and completely conventional — the baseline everything else is trying to beat.",
    box: "0 0 14 14",
    svg: '<circle class="pin-body" cx="7" cy="7" r="5"/>'
  },
  {
    id: "square", name: "Square", size: [14, 14], anchor: "center",
    note: "A small squircle. Reads as typographic rather than as a default map dot, and tiles neatly where pins sit close.",
    box: "0 0 15 15",
    svg: '<rect class="pin-body" x="2" y="2" width="11" height="11" rx="3"/>'
  },
  {
    id: "diamond", name: "Diamond", size: [15, 15], anchor: "center",
    note: "A rotated square. Distinctive and gives a precise visual centre, though it is spiky and can read as a warning marker.",
    box: "0 0 16 16",
    svg: '<path class="pin-body" d="M8 1.4 14.6 8 8 14.6 1.4 8z"/>'
  },
  {
    id: "flag", name: "Flag", size: [17, 26], anchor: "bottom",
    note: "A pennant on a pole, planted at the address. Has a bit of narrative to it — but it is directional, so a row of them all lean the same way.",
    box: "0 0 18 28",
    svg: '<line class="pin-stem" x1="4" y1="27" x2="4" y2="3"/><path class="pin-body" d="M4.6 3.4h11.2l-3.1 4.6 3.1 4.6H4.6z"/>'
  },
  {
    id: "chevron", name: "Chevron", size: [16, 20], anchor: "bottom",
    note: "A bare caret pointing down at the spot. Almost no ink and still directional — the minimal way to point without drawing a whole pin.",
    box: "0 0 18 22",
    svg: '<path class="pin-stroke-heavy" d="M3.4 6.6 9 17.6l5.6-11"/>'
  },
  {
    id: "hollow-drop", name: "Open drop", size: [21, 30], anchor: "bottom",
    note: "The teardrop with its fill removed. Keeps the pointing and the familiarity, but sheds most of the weight that makes 47 solid teardrops heavy.",
    box: "0 0 24 34",
    svg: '<path class="pin-hollow" d="M12 1.4c-5.8 0-10.5 4.6-10.5 10.3 0 7.7 10.5 20.9 10.5 20.9s10.5-13.2 10.5-20.9C22.5 6 17.8 1.4 12 1.4z"/>'
  },
  {
    id: "crosshair", name: "Crosshair", size: [17, 17], anchor: "center",
    note: "A survey mark. Precise and technical — suits a map that is really a dataset, less so one that is a restaurant guide.",
    box: "0 0 18 18",
    svg: '<circle class="pin-hollow" cx="9" cy="9" r="5"/><path class="pin-stroke" d="M9 .8v3.4M9 13.8v3.4M.8 9h3.4M13.8 9h3.4"/>'
  },
];

const style = document.createElement("style");
style.textContent = `
  .pin { background: none; border: 0; }
  .pin svg, .swatch svg { overflow: visible; }
  .pin svg { width: 100%; height: 100%; display: block; }
  .pin-body { fill: var(--accent); stroke: var(--pin-ring); stroke-width: 1.5; paint-order: stroke; }
  .pin-eye { fill: var(--pin-ring); }
  .pin-eye-stroke { stroke: var(--pin-ring); stroke-width: 1.6; fill: none; stroke-linecap: round; }
  .pin-hollow { fill: var(--surface-1); stroke: var(--accent); stroke-width: 2.4; }
  .pin-stem { stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; }
  .pin-stroke { stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-linecap: round; }
  .pin-stroke-heavy { stroke: var(--accent); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
`;
document.head.appendChild(style);

const TILES = {
  light: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  dark: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
};

let map, layer, tiles, records = [], active = VARIANTS[0];

function iconFor(v) {
  return L.divIcon({
    html: `<svg viewBox="${v.box}">${v.svg}</svg>`,
    className: "pin",
    iconSize: v.size,
    iconAnchor: v.anchor === "bottom"
      ? [v.size[0] / 2, v.size[1]]
      : [v.size[0] / 2, v.size[1] / 2],
  });
}

function draw() {
  layer.clearLayers();
  const icon = iconFor(active);
  records.forEach((r) => L.marker(r.point, { icon, alt: r.name }).addTo(layer));

  document.getElementById("note").textContent = active.note;
  document.getElementById("code").textContent =
    `// ${active.name} — drop into map.js\n` +
    `const PIN_SIZE = [${active.size}];\n` +
    `iconAnchor: [${active.anchor === "bottom"
      ? `PIN_SIZE[0] / 2, PIN_SIZE[1]`
      : `PIN_SIZE[0] / 2, PIN_SIZE[1] / 2`}]\n` +
    `<svg viewBox="${active.box}">${active.svg}</svg>`;

  document.querySelectorAll(".swatch").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.id === active.id))
  );
}

function buildSwatches() {
  const host = document.getElementById("swatches");
  VARIANTS.forEach((v) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "swatch";
    b.dataset.id = v.id;
    b.innerHTML =
      `<span class="art"><svg viewBox="${v.box}" width="${v.size[0]}" height="${v.size[1]}">${v.svg}</svg></span>` +
      `<span>${v.name}</span>`;
    b.addEventListener("click", () => { active = v; draw(); });
    host.appendChild(b);
  });
}

function setTheme(dark) {
  if (dark) document.documentElement.dataset.theme = "dark";
  else delete document.documentElement.dataset.theme;
  document.getElementById("theme").textContent = dark ? "Light" : "Dark";
  if (tiles) map.removeLayer(tiles);
  tiles = L.tileLayer(dark ? TILES.dark : TILES.light, {
    subdomains: "abcd", maxZoom: 19,
    attribution: '&copy; OpenStreetMap &copy; CARTO',
  }).addTo(map);
}

async function init() {
  const resp = await fetch("../data/restaurants.geo.json");
  const payload = await resp.json();
  records = payload.restaurants
    .filter((r) => r.geo && r.geo.wgs84 && r.city === "Shanghai")
    .map((r) => ({ name: r.name_en, point: { lat: r.geo.wgs84.lat, lng: r.geo.wgs84.lng } }));

  map = L.map("map");
  layer = L.layerGroup().addTo(map);
  setTheme(false);

  const lats = records.map((r) => r.point.lat).sort((a, b) => a - b);
  const lngs = records.map((r) => r.point.lng).sort((a, b) => a - b);
  const t = Math.floor(records.length * 0.05);
  map.fitBounds(
    L.latLngBounds(
      [lats[t], lngs[t]],
      [lats[lats.length - 1 - t], lngs[lngs.length - 1 - t]]
    ),
    { padding: [40, 40], maxZoom: 16, animate: false }
  );

  buildSwatches();
  draw();

  document.getElementById("theme").addEventListener("click", () =>
    setTheme(document.documentElement.dataset.theme !== "dark")
  );
  document.getElementById("zoom-in").addEventListener("click", () => map.zoomIn());
  document.getElementById("zoom-out").addEventListener("click", () => map.zoomOut());
}

init().catch((err) => {
  document.getElementById("map").innerHTML =
    `<div style="padding:28px;font-size:14px">Could not load the data (${err.message}). ` +
    `Serve the project with <code>python -m http.server 8000</code> and open ` +
    `<code>http://localhost:8000/web/pin-lab.html</code>.</div>`;
});
</script>
</body>
</html>
