<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basemap lab — vector vs CARTO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<style>
  /* A scratch page for deciding whether a hand-drawn vector basemap can replace
     CARTO's raster tiles. Same pins, same tokens, same seal as the real map --
     nothing in map.js or index.html depends on this file, and nothing here
     writes back to them. Sibling of pin-lab.html. */
  .lab { display: grid; grid-template-rows: auto 1fr; height: 100%; }

  .lab-head {
    padding: 14px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface-1);
  }

  .lab-head h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }

  .lab-head p {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .lab-body { display: grid; grid-template-columns: 268px 1fr; min-height: 0; }

  .panel {
    overflow-y: auto;
    padding: 14px;
    border-right: 1px solid var(--hairline);
    background: var(--surface-1);
    align-content: start;
    font-size: 12.5px;
  }

  .panel h2 {
    margin: 16px 0 7px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    font-weight: 600;
  }

  .panel h2:first-child { margin-top: 0; }

  .choices { display: grid; gap: 6px; }

  .choice {
    display: grid;
    gap: 3px;
    padding: 9px 11px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--page);
    cursor: pointer;
    font: inherit;
    text-align: left;
    color: var(--text-secondary);
  }

  .choice:hover { border-color: var(--accent); }

  .choice[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--wash);
    color: var(--accent-ink);
  }

  .choice strong { font-size: 12.5px; font-weight: 600; }
  .choice span { font-size: 11.5px; line-height: 1.45; color: var(--text-muted); }
  .choice[aria-pressed="true"] span { color: var(--accent-ink); opacity: 0.85; }

  .status {
    margin: 7px 2px 0;
    font-size: 11px;
    line-height: 1.4;
    color: var(--text-muted);
    min-height: 2.6em;
  }

  .toggles { display: grid; gap: 5px; }

  .toggles label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 2px;
    cursor: pointer;
    color: var(--text-secondary);
  }

  .toggles input { accent-color: var(--accent); }

  .readout {
    margin-top: 14px;
    padding: 9px 11px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--page);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .readout b { color: var(--text-secondary); font-weight: 600; }

  .lab-map { position: relative; min-width: 0; }
  #map { height: 100%; width: 100%; background: var(--page); }

  .lab-bar {
    position: absolute;
    z-index: 600;
    top: 12px; right: 12px;
    display: flex;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface-1);
    box-shadow: var(--shadow);
  }

  .lab-bar button {
    border: 0;
    border-radius: 5px;
    padding: 5px 9px;
    background: none;
    font: inherit;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
  }

  .lab-bar button:hover { background: var(--wash); }
  .lab-bar button[aria-pressed="true"] { background: var(--wash); color: var(--accent-ink); font-weight: 600; }

  .warn {
    position: absolute;
    z-index: 600;
    left: 12px; bottom: 24px;
    max-width: min(420px, calc(100% - 24px));
    padding: 8px 11px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    background: var(--surface-1);
    box-shadow: var(--shadow);
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  .warn[hidden] { display: none; }
</style>
</head>
<body>

<div class="lab">
  <header class="lab-head">
    <h1>Basemap lab</h1>
    <p>Can a 2MB hand-drawn basemap replace 26MB of CARTO tiles? Same 47 pins, same tokens. Flip to CARTO to compare.</p>
  </header>

  <div class="lab-body">
    <div class="panel">
      <h2>Region</h2>
      <div class="choices" id="regions"></div>
      <p class="status" id="region-status"></p>

      <h2>Basemap</h2>
      <div class="choices" id="presets"></div>

      <h2>Layers</h2>
      <div class="toggles" id="layers"></div>

      <h2>Also</h2>
      <div class="toggles">
        <label><input type="checkbox" id="show-pins" checked> Restaurant pins</label>
        <label><input type="checkbox" id="show-labels" checked> Hand-set labels</label>
      </div>

      <div class="readout" id="readout"></div>
    </div>

    <div class="lab-map">
      <div class="lab-bar">
        <button type="button" id="theme">Dark</button>
        <button type="button" id="zoom-out">&minus;</button>
        <button type="button" id="zoom-in">+</button>
      </div>
      <div id="map"></div>
      <div class="warn" id="warn" hidden></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- config.js first: basemap.js reads DATA_BASE and loadJSON from it. -->
<script src="js/config.js"></script>
<script src="js/basemap.js"></script>
<script>
/* Presets, labels, fonts and the renderer all come from js/basemap.js -- the
   same file the real map uses, so what is compared here is what ships. The lab
   adds only the CARTO comparison and the controls around it. */
const PRESETS = [BASEMAP_PRESETS.ink, BASEMAP_PRESETS.positron, BASEMAP_PRESETS.guide];
const PRESET_NOTES = {
  ink: "Chosen. Monochrome and printed -- roads as thin dark strokes rather than pale fills, closer to a map in the back of a book, and the strongest contrast with the seals.",
  positron: "Mimics the CARTO look the map used to borrow. The control the chosen style had to beat.",
  guide: "Warm paper, hairline roads, ink-wash water. The basemap recedes furthest here.",
};
const LABELS = BASEMAP_LABELS;
const LABEL_FONT = BASEMAP_LABEL_FONT;
const LAYER_ORDER = BASEMAP_LAYER_ORDER;
const MIN_ZOOM_FOR = BASEMAP_MIN_ZOOM;

const LAYER_NAMES = {
  water: "Water", green: "Green space",
  roads_tertiary: "Tertiary roads", roads_secondary: "Secondary roads",
  roads_major: "Major roads",
};

const TILES = {
  light: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  dark: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
};

const SEAL = '<svg viewBox="0 0 18 18">' +
  '<rect class="pin-body" x="1.6" y="1.6" width="14.8" height="14.8" rx="2.6"/>' +
  '<path class="pin-eye-stroke" d="M9 4.8v8.4M4.8 9h8.4"/></svg>';

const pinStyle = document.createElement("style");
pinStyle.textContent = `
  .pin { background: none; border: 0; }
  .pin svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .pin-body { fill: var(--accent); stroke: var(--pin-ring); stroke-width: 1.5; paint-order: stroke; }
  .pin-eye-stroke { stroke: var(--pin-ring); stroke-width: 1.6; fill: none; stroke-linecap: round; }
`;
document.head.appendChild(pinStyle);

/* ------------------------------------------------------------------------- */

let map, basemap, tiles, pinLayer;
let allRecords = [], records = [], regions = [], region = null;
const loaded = new Map();   // region key -> { data, kb, ms }
// Ink was chosen 2026-08-09 and is what the map now ships. The others stay for
// comparison, so a later change of mind can be judged rather than guessed at.
let preset = BASEMAP_PRESETS[BASEMAP_SHIPPED_PRESET];
let theme = "light";
let useCarto = false;
let loading = false;
const visible = { water: true, green: true, roads_major: true, roads_secondary: true, roads_tertiary: true };

const CITY_FOR = { shanghai: "Shanghai", suzhou: "Suzhou", hangzhou: "Hangzhou" };

function palette() { return preset[theme]; }
function labelsOn() { return document.getElementById("show-labels").checked; }

function applyBasemap() {
  if (tiles) { map.removeLayer(tiles); tiles = null; }
  if (useCarto) {
    if (basemap && map.hasLayer(basemap)) map.removeLayer(basemap);
    tiles = L.tileLayer(theme === "dark" ? TILES.dark : TILES.light, {
      subdomains: "abcd", maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO',
    }).addTo(map);
    document.getElementById("map").style.background = theme === "dark" ? "#0d0d0d" : "#f9f9f7";
  } else {
    if (basemap && !map.hasLayer(basemap)) basemap.addTo(map);
    basemap.setStyle(preset, theme, labelsOn(), visible);
    document.getElementById("map").style.background = palette().page;
  }
  updateReadout();
  checkCoverage();
}

/* Regions are fetched the first time they are asked for and then kept. Only
   Shanghai is paid for up front; the two day trips cost nothing until clicked. */
async function loadRegion(key, fit = true) {
  const spec = regions.find((r) => r.region === key);
  if (!spec || loading) return;
  region = key;
  syncRegionTabs();

  if (!loaded.has(key)) {
    loading = true;
    setRegionStatus(`fetching ${spec.label} — ${spec.kb.toLocaleString()} KB…`);
    const started = performance.now();
    const resp = await fetch("../data/" + spec.file);
    if (!resp.ok) { setRegionStatus(`could not load ${spec.file}`); loading = false; return; }
    const text = await resp.text();
    loaded.set(key, {
      data: JSON.parse(text),
      kb: Math.round(text.length / 1024),
      ms: Math.round(performance.now() - started),
    });
    loading = false;
  }

  const entry = loaded.get(key);
  basemap.addRegion(key, entry.data, LABELS[key] || [], spec);
  basemap.setOnlyRegions([key]);   // the lab looks at one region at a time
  // The overview spans all three cities, so it gets all the pins.
  records = CITY_FOR[key]
    ? allRecords.filter((r) => r.city === CITY_FOR[key])
    : allRecords.slice();
  drawPins();
  if (fit) fitRegion();
  applyBasemap();
  setRegionStatus(`${spec.label}: ${entry.kb.toLocaleString()} KB, loaded in ${entry.ms} ms`);
}

function fitRegion() {
  if (!records.length) return;
  const lats = records.map((r) => r.point.lat).sort((a, b) => a - b);
  const lngs = records.map((r) => r.point.lng).sort((a, b) => a - b);
  // trim the outermost 5% so a couple of far-flung pins do not dictate the zoom
  const t = Math.floor(records.length * 0.05);
  map.fitBounds(
    L.latLngBounds([lats[t], lngs[t]],
                   [lats[lats.length - 1 - t], lngs[lngs.length - 1 - t]]),
    { padding: [50, 50], maxZoom: 16, animate: false });
}

function setRegionStatus(text) {
  document.getElementById("region-status").textContent = text;
}

function drawPins() {
  pinLayer.clearLayers();
  if (!document.getElementById("show-pins").checked) return;
  const icon = L.divIcon({
    html: SEAL, className: "pin",
    iconSize: [17, 17], iconAnchor: [8.5, 8.5],
  });
  records.forEach((r) => L.marker(r.point, { icon, alt: r.name, title: r.name }).addTo(pinLayer));
}

function checkCoverage() {
  const warn = document.getElementById("warn");
  const spec = regions.find((r) => r.region === region);
  if (useCarto || !spec) { warn.hidden = true; return; }
  const b = map.getBounds();
  const [s, w, n, e] = spec.bbox;
  const outside = b.getSouth() < s - 0.02 || b.getWest() < w - 0.02 ||
                  b.getNorth() > n + 0.02 || b.getEast() > e + 0.02;
  warn.hidden = !outside;
  if (outside) {
    warn.innerHTML = `<b>Past the edge of ${spec.label}.</b> Each region is its ` +
      `own extract, so there is nothing drawn between the cities. Switch region ` +
      `above rather than panning across.`;
  }
}

function updateReadout() {
  const el = document.getElementById("readout");
  const s = basemap && basemap._stats;
  const spec = regions.find((r) => r.region === region);
  const loadedKb = [...loaded.values()].reduce((n, e) => n + e.kb, 0);
  const allKb = regions.reduce((n, r) => n + r.kb, 0);
  el.innerHTML =
    `<b>region</b>  ${spec ? spec.label : "—"}<br>` +
    `<b>source</b>  ${useCarto ? "CARTO raster" : "vector, " + (spec ? spec.kb.toLocaleString() : "?") + " KB"}<br>` +
    `<b>loaded</b>  ${loaded.size}/${regions.length} regions, ${loadedKb.toLocaleString()} of ${allKb.toLocaleString()} KB<br>` +
    `<b>zoom</b>    ${map.getZoom()}` +
    (s && !useCarto
      ? `<br><b>drawn</b>   ${s.drawn.toLocaleString()} (${s.skipped.toLocaleString()} culled)` +
        `<br><b>labels</b>  ${s.labelsDrawn}` +
        `<br><b>redraw</b>  ${s.ms.toFixed(1)} ms`
      : "");
}

function buildPresets() {
  const host = document.getElementById("presets");
  const make = (id, name, note, onClick) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.dataset.id = id;
    b.innerHTML = `<strong>${name}</strong><span>${note}</span>`;
    b.addEventListener("click", onClick);
    host.appendChild(b);
    return b;
  };
  PRESETS.forEach((p) => make(p.id, p.name, PRESET_NOTES[p.id], () => {
    preset = p; useCarto = false; applyBasemap(); syncPressed();
  }));
  make("carto", "CARTO (today)", "The raster tiles the map uses now. 26MB to bundle, and their terms do not allow it.", () => {
    useCarto = true; applyBasemap(); syncPressed();
  });
  syncPressed();
}

function syncPressed() {
  document.querySelectorAll(".choice").forEach((b) => {
    const on = useCarto ? b.dataset.id === "carto" : b.dataset.id === preset.id;
    b.setAttribute("aria-pressed", String(on));
  });
}

function buildRegionTabs() {
  const host = document.getElementById("regions");
  regions.forEach((r) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice region";
    b.dataset.region = r.region;
    b.innerHTML = `<strong>${r.label}</strong>` +
      `<span>${r.rings.toLocaleString()} rings &middot; ${r.kb.toLocaleString()} KB ` +
      `&middot; ${r.kb_gzip.toLocaleString()} KB gzipped</span>`;
    b.addEventListener("click", () => loadRegion(r.region));
    host.appendChild(b);
  });
}

function syncRegionTabs() {
  document.querySelectorAll(".region").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.region === region));
  });
}

function buildLayerToggles() {
  const host = document.getElementById("layers");
  LAYER_ORDER.slice().reverse().forEach((name) => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" checked data-layer="${name}"> ${LAYER_NAMES[name]}`;
    label.querySelector("input").addEventListener("change", (ev) => {
      visible[name] = ev.target.checked;
      if (!useCarto) basemap.setStyle(preset, theme, labelsOn(), visible);
      updateReadout();
    });
    host.appendChild(label);
  });
}

function setTheme(dark) {
  theme = dark ? "dark" : "light";
  if (dark) document.documentElement.dataset.theme = "dark";
  else delete document.documentElement.dataset.theme;
  document.getElementById("theme").textContent = dark ? "Light" : "Dark";
  applyBasemap();
}

async function init() {
  const [geoResp, indexResp] = await Promise.all([
    fetch("../data/restaurants.geo.json"),
    fetch("../data/basemap.index.json"),
  ]);
  if (!indexResp.ok) {
    throw new Error("data/basemap.index.json missing — run python basemap/build_basemap.py");
  }
  const payload = await geoResp.json();
  regions = (await indexResp.json()).regions;

  allRecords = payload.restaurants
    .filter((r) => r.geo && r.geo.wgs84)
    .map((r) => ({
      name: r.name_en, city: r.city,
      point: { lat: r.geo.wgs84.lat, lng: r.geo.wgs84.lng },
    }));

  map = L.map("map", { preferCanvas: true, minZoom: 8, maxZoom: 18 });
  basemap = new VectorBasemap({ onDraw: () => updateReadout() });
  pinLayer = L.layerGroup().addTo(map);
  map.setView([31.2295, 121.4720], 13, { animate: false });

  L.control.attribution({ prefix: false })
    .addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors (ODbL)')
    .addTo(map);

  buildRegionTabs();
  buildPresets();
  buildLayerToggles();
  await loadRegion("shanghai");

  map.on("zoomend moveend", () => { checkCoverage(); updateReadout(); });
  document.getElementById("theme").addEventListener("click", () =>
    setTheme(document.documentElement.dataset.theme !== "dark"));
  document.getElementById("zoom-in").addEventListener("click", () => map.zoomIn());
  document.getElementById("zoom-out").addEventListener("click", () => map.zoomOut());
  document.getElementById("show-pins").addEventListener("change", drawPins);
  document.getElementById("show-labels").addEventListener("change", () => {
    if (!useCarto) basemap.setStyle(preset, theme, labelsOn(), visible);
  });
}

init().catch((err) => {
  document.getElementById("map").innerHTML =
    `<div style="padding:28px;font-size:14px;line-height:1.6">` +
    `<strong>Could not start the lab.</strong><br>${err.message}<br><br>` +
    `Run <code>python basemap/build_basemap.py</code> to generate the basemap, ` +
    `then serve with <code>python serve.py</code> and open ` +
    `<code>http://localhost:8000/web/basemap-lab.html</code>.</div>`;
});
</script>
</body>
</html>
